[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "datacard-viewer"
version = "0.1.0"
description = "Inspect Combine datacards and ROOT systematic templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "uproot>=5.6,<6",
    "streamlit>=1.45,<2",
    "plotly>=6,<7",
    "pandas>=2.2,<4",
]

[project.scripts]
view-card = "datacard_viewer.cli:main"

[tool.hatch.build.targets.sdist]
include = ["/datacard_viewer", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/.streamlit"]

[dependency-groups]
dev = ["pytest>=8", "hist>=2.8", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["datacard_viewer/vendor"]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
